<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriPlan - Diet Planner</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">
            <span class="logo-icon">🥗</span>
            <span class="logo-text">Nutri<span class="highlight-plan">Plan</span></span>
        </a>
        <nav class="nav-links">
            <a href="pantry.html">Pantry</a>
            <a href="recipes.html">Recipes</a>
            <a href="planner.html" class="active">Planner</a>
            <a href="grocery.html">Grocery List</a>
        </nav>
        <label class="theme-switch" for="theme-toggle">
            <input type="checkbox" id="theme-toggle">
            <span class="slider round">
                <span class="icon sun-icon">☀️</span>
                <span class="icon moon-icon">🌙</span>
            </span>
        </label>
        <a href="login.html" class="btn-signin">Sign in</a>
    </header>

    <main class="page-container">
        <header class="page-header">
            <h1 class="page-title">Personalized <span class="highlight">Diet Planner</span></h1>
            <p class="page-subtitle">Calculate calories and generate custom macro meal plans.</p>
        </header>

        <div class="content-split">
            <section class="card-section">
                <form id="diet-form" class="form-grid-2">
                    <div class="form-group">
                        <label>Weight (kg)</label>
                        <input type="number" step="0.1" id="diet-weight" required>
                    </div>
                    <div class="form-group">
                        <label>Height (cm)</label>
                        <input type="number" id="diet-height" required>
                    </div>
                    <div class="form-group">
                        <label>Age</label>
                        <input type="number" id="diet-age" required>
                    </div>
                    <div class="form-group">
                        <label>Gender</label>
                        <select id="diet-gender">
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-submit full-width">Calculate Plan</button>
                </form>
            </section>

            <section class="card-section">
                <h2>Plan Details</h2>
                <div id="diet-result" class="result-box">
                    Fill in your parameters and generate to view your daily plan.
                </div>
            </section>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-container">
            <p class="copyright-text">Made by team 3 (المتجيرين)</p>
        </div>
    </footer>

    <script src="dark-mode.js"></script>
    <script src="planner.js"></script>
</body>
</html>
