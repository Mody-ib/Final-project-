<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriPlan - Create Account</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">
            <span class="logo-icon">🥗</span>
            <span class="logo-text">Nutri<span class="highlight-plan">Plan</span></span>
        </a>
        <nav class="nav-links">
            <a href="pantry.html">Pantry</a>
            <a href="recipes.html">Recipes</a>
            <a href="planner.html">Planner</a>
            <a href="grocery.html">Grocery List</a>
        </nav>
        <label class="theme-switch" for="theme-toggle">
    <input type="checkbox" id="theme-toggle">
    <span class="slider round">
        <span class="icon sun-icon">☀️</span>
        <span class="icon moon-icon">🌙</span>
    </span>
</label>
        <a href="login.html" class="btn-signin">Sign in</a>
    </header>

    <main class="page-container" style="max-width: 480px; margin-top: 3rem;">
        <section class="card-section">
            <header class="page-header" style="text-align: center; margin-bottom: 1.5rem;">
                <h1 class="page-title" style="font-size: 1.8rem;">Create <span class="highlight">Account</span></h1>
                <p class="page-subtitle">Join NutriPlan to manage your personal recipes and diet plans.</p>
            </header>

            <form id="register-form">
                <div class="form-group">
                    <label for="reg-name">Full Name</label>
                    <input type="text" id="reg-name" required placeholder="John Doe">
                </div>

                <div class="form-group">
                    <label for="reg-email">Email Address</label>
                    <input type="email" id="reg-email" required placeholder="name@example.com">
                </div>

                <div class="form-group">
                    <label for="reg-password">Password</label>
                    <input type="password" id="reg-password" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn-submit full-width">Sign Up</button>
            </form>

            <div id="register-message" style="margin-top: 1rem; text-align: center; font-size: 0.9rem;"></div>

            <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
                Already have an account? <a href="login.html" style="color: var(--primary-emerald); font-weight: 600; text-decoration: none;">Sign In</a>
            </p>
        </section>
    </main>
    <script src="dark-mode.js"></script>
    <script src="register.js"></script>
    <footer class="site-footer">
    <div class="footer-container">
        <p class="copyright-text">Made by team 3 (المتجيرين)</p>
    </div>
</footer>
</body>
</html>
