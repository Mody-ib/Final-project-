<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriPlan - Pantry Inventory</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">
            <span class="logo-icon">🥗</span>
            <span class="logo-text">Nutri<span class="highlight-plan">Plan</span></span>
        </a>
        <nav class="nav-links">
            <a href="pantry.html" class="active">Pantry</a>
            <a href="recipes.html">Recipes</a>
            <a href="planner.html">Planner</a>
            <a href="grocery.html">Grocery List</a>
        </nav>
        <label class="theme-switch" for="theme-toggle">
    <input type="checkbox" id="theme-toggle">
    <span class="slider round">
        <span class="icon sun-icon">☀️</span>
        <span class="icon moon-icon">🌙</span>
    </span>
</label>
        <a href="login.html" class="btn-signin">Sign in</a>
    </header>

    <main class="page-container">
        <header class="page-header">
            <h1 class="page-title">Pantry <span class="highlight">Inventory</span></h1>
            <p class="page-subtitle">Manage available ingredients in your kitchen efficiently.</p>
        </header>

        <section class="card-section">
            <form id="pantry-form" class="form-grid">
                <div class="form-group">
                    <label>Ingredient ID</label>
                    <input type="number" id="pantry-ing-id" required placeholder="e.g. 101">
                </div>
                <div class="form-group">
                    <label>Amount</label>
                    <input type="number" step="0.1" id="pantry-amount" required placeholder="e.g. 500">
                </div>
                <div class="form-group">
                    <label>Unit</label>
                    <input type="text" id="pantry-unit" required placeholder="e.g. grams, pcs">
                </div>
                <button type="submit" class="btn-submit">Add Item</button>
            </form>
        </section>

        <section class="card-section">
            <h2>Current Stock</h2>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Ingredient</th>
                        <th>Amount</th>
                        <th>Unit</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="pantry-table-body">
                    <!-- Items will be loaded here dynamically -->
                </tbody>
            </table>
        </section>
    </main>
    <script src="dark-mode.js"></script>
    <footer class="site-footer">
    <div class="footer-container">
        <p class="copyright-text">Made by team 3 (المتجيرين)</p>
    </div>
</footer>

</body>
</html>
